# This file MUST live at <repo-root>/.github/workflows/. It does not belong beside the
# code in V2/, and it spent its first three commits there -- where GitHub never saw it, so
# the workflow had zero runs and would have had zero forever. Nothing about the file was
# wrong; only its path was, which is why reading it could not find the bug and running it
# could. `defaults.run.working-directory: V2` below is what lets it live up here and still
# operate on the project.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every CI run is reproducible from the lockfile. No resolution happens here.
  #
  # This REQUIRES `uv.lock` to be committed. Without it every job fails at `uv sync`,
  # which is the correct behaviour - a CI run that resolves its own dependencies is not
  # testing the thing that will be deployed.
  UV_FROZEN: "1"

  # Pinned, not inferred. `requires-python = ">=3.12"` lets uv pick any newer
  # interpreter, so CI's Python would drift on uv's schedule rather than ours - and the
  # first real finding of this project's gate run was a 3.14-only deprecation that only
  # one interpreter would have surfaced. `.python-version` holds the same pin locally.
  UV_PYTHON: "3.14"

jobs:
  # Fast gate. Fails in seconds on a style or type error so the slower job is not
  # queued behind a typo.
  static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: V2
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: install
        run: uv sync --all-extras

      - name: ruff - lint
        run: uv run ruff check --output-format=github .

      - name: ruff - format
        run: uv run ruff format --check .

      - name: pyright - strict
        run: uv run pyright

  # The boundary wall is its own job on purpose. It is the one test whose failure is
  # always an architectural regression rather than a bug, and separating it means the
  # summary says which kind of thing broke.
  boundaries:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: V2
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: import boundaries
        run: uv run pytest tests/test_boundaries.py -v

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: V2
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mynotes_v2
        ports: ["5432:5432"]
        # The claim protocol's correctness IS database atomicity, so the db-marked
        # tests are not optional and the service must be ready before they run.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: postgresql://postgres:postgres@localhost:5432/mynotes_v2
      APP_ENV: ci
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --all-extras

      # The two steps below run EVERYTHING between them. `db`-marked tests are excluded
      # by neither: a skipped concurrency test is a concurrency test that does not
      # exist, and those are the ones that must never be skipped.
      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing -m "not slow"

      # `|| [ $? -eq 5 ]` instead of `continue-on-error`. Playwright's browser is a
      # separate download and nothing is marked slow until the engine lands at M5, so
      # pytest exits 5 ("no tests ran") today and that is the ONE acceptable failure.
      # `continue-on-error: true` would also swallow a genuine slow-test failure from
      # M5 onward, and nobody would remember to remove it - which is the exact trap
      # this step was written to avoid for itself.
      - name: slow - browser and provider-stubbed paths
        run: uv run pytest -m slow || [ $? -eq 5 ]
