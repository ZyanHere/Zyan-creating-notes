[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-engine"
version = "0.1.0"
description = "Deterministic document renderer: Document Model + Template + Theme -> PDF. No LLM, no network."
requires-python = ">=3.11"

# Versions are pinned, not floated. The renderer's output depends on the exact
# Chromium build Playwright ships, so "deterministic" means: same input, same
# pinned environment, same output. Bumping playwright invalidates golden images
# and must be a deliberate act.
dependencies = [
    "pydantic==2.13.5",
    "jinja2==3.1.6",
    "playwright==1.62.0",
]

[project.optional-dependencies]
test = [
    "pypdfium2==5.0.3",
    "pytest==9.0.1",
]

[project.scripts]
document-engine = "engine.cli:main"

[tool.setuptools]
packages = ["engine"]
include-package-data = true

[tool.setuptools.package-data]
engine = []
